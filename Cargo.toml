[workspace]
members = [
    "api",
    "comhairle_macros",
    "adaptors/heyform-rust-sdk",
    "adaptors/ragflow",
    "api_spec_gen",
	"sensemakar/*"
]
resolver = "2"

[workspace.package]
rust-version = "1.95"

[workspace.dependencies]
aide = "0.14.0"
async-trait = "0.1.83"
lettre = "0.11.16"
minijinja = "2.10.2"
serde = "1.0.218"
serde_json = "1.0.139"
sqlx = "0.8.3"
tokio = "1.43.0"
uuid = "1.14.0"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
# Deny panics
# unwrap_used = "deny"
# expect_used = "deny"
# indexing_slicing = "deny"
# arithmetic_side_effects = "deny"
# unreachable = "deny"
# unimplemented = "deny"
# unchecked_time_subtraction = "deny"
# todo = "deny"
# string_slice = "deny"
# panic_in_result_fn = "deny"
# panic = "deny"
# exit = "deny"
# as_conversions = "deny"
