name: Playwright Tests

on:
  push:
    branches: [ main, staging, 1131-add-playwright-for-e2e-testing-workflow-test ]
  pull_request:
    branches: [ main, staging ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db
      RESOURCE_BUCKET: comhairle-media-test
      DEFAULT_CONVERSATION_IMAGE_URL: "https://comhairle-media-test.storage.com/images/comhairle-conversation-placeholder.png"
      PLAYWRIGHT_ADMIN_USERNAME: admin@crown-shy.com
      PLAYWRIGHT_ADMIN_PASSWORD: adminPassword123!

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          shared-key: api

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ui
        run: pnpm install

      - name: Get Playwright version
        id: playwright-version
        working-directory: ui
        run: echo "version=$(pnpm --filter comhairle exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ steps.playwright-version.outputs.version }}

      - name: Build API server
        run: cargo build --bin comhairle_api

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: ui
        run: pnpm --filter comhairle exec playwright install --with-deps

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: ui
        run: pnpm --filter comhairle exec playwright install-deps

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..30}; do
            nc -z localhost 5432 && echo "PostgreSQL is ready" && exit 0
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL failed to start" && exit 1

      - name: Start API server
        id: start-api-server
        run: |
          nohup ./target/debug/comhairle_api > api-server.log 2>&1 &
          echo "pid=$!" >> "$GITHUB_OUTPUT"
          for i in {1..30}; do
            curl -sf http://localhost:3000/health && echo "API is ready" && exit 0
            echo "Waiting for API server..."
            sleep 2
          done
          echo "API server failed to start" && cat api-server.log && exit 1

      - name: Seed admin user
        env:
          ADMIN_EMAIL: ${{ env.PLAYWRIGHT_ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ env.PLAYWRIGHT_ADMIN_PASSWORD }}
        run: ./scripts/seed-minimal.sh

      - name: Run Playwright tests
        working-directory: ui
        run: pnpm --filter comhairle exec playwright test

      - name: Stop API server
        if: ${{ always() }}
        run: kill ${{ steps.start-api-server.outputs.pid }} || true

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: api-server-log
          path: api-server.log
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
