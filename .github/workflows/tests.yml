name: tests 

## run tests on push to all branches
on:
  push:
  workflow_dispatch:  # Allows manual triggering
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      -
        name: Checkout repository
        uses: actions/checkout@v4

      -
        name: Detect API and frontend changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'api/**'
              - 'adaptors/**'
              - 'comhairle_macros/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'api/Cargo.toml'
              - 'api/Cargo.lock'
              - 'rust-toolchain'
              - 'rust-toolchain.toml'
              - '.github/workflows/tests.yml'
            frontend:
              - 'ui/**'
              - '.github/workflows/tests.yml'

  frontend-unit-tests:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    environment: base 

    steps:
      - 
        name: Checkout repository
        uses: actions/checkout@v3

      -
        name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 'lts/*' # Use the latest LTS version of Node.js

      - 
        name: Install pnpm
        run: npm install -g pnpm

      - 
        name: Install dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      -
        name: Run tests
        working-directory: ui
        run: pnpm --filter comhairle test:unit

  api-unit-tests:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    environment: base 

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        # wait for PG to be ready, disabled because we check later on
        # options: >-
        #   --health-cmd="pg_isready -U test_user -d test_db"
        #   --health-interval=10s
        #   --health-timeout=5s
        #   --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - 
        name: Checkout repository
        uses: actions/checkout@v4

      - 
        name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      -
        name: Resolve cargo-nextest version
        id: nextest-version
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo search cargo-nextest --limit 1 | sed -n 's/^cargo-nextest = "\([^"]*\)".*/\1/p')
          if [[ -z "$version" ]]; then
            echo "Failed to resolve cargo-nextest version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      -
        name: Cache cargo-nextest
        id: cache-nextest
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: ${{ runner.os }}-cargo-nextest-${{ steps.nextest-version.outputs.version }}

      -
        name: Install cargo nextest
        if: steps.cache-nextest.outputs.cache-hit != 'true'
        run: cargo install cargo-nextest --locked --version ${{ steps.nextest-version.outputs.version }}

      - 
        name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - 
        name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..30}; do
            nc -z localhost 5432 && echo "PostgreSQL is ready" && exit 0
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL failed to start" && exit 1
      
      - 
        name: Run unit tests
        working-directory: api
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db
          RESOURCE_BUCKET: comhairle_resources
          CARGO_HOME: ~/.cargo
          DEFAULT_CONVERSATION_IMAGE_URL: "https://comhairle-media-test.storage.com/images/comhairle-conversation-placeholder.png"
          BOT_SERVICE__HOST: ${{ secrets.BOT_SERVICE__HOST }}
          BOT_SERVICE__API_KEY: ${{ secrets.BOT_SERVICE__API_KEY }}
          BOT_SERVICE__DEFAULT_KNOWLEDGE_BASE_ID: ${{ secrets.BOT_SERVICE__DEFAULT_KNOWLEDGE_BASE_ID }}
          BOT_SERVICE__ELICITATION_BOT_AGENT_ID: ${{ secrets.BOT_SERVICE__ELICITATION_BOT_AGENT_ID }}
          BOT_SERVICE__THINKING_SPACE_AGENT_ID: ${{ secrets.BOT_SERVICE__THINKING_SPACE_AGENT_ID }}
          BOT_SERVICE__THINKING_SPACE_SUMMARY_AGENT_ID: ${{ secrets.BOT_SERVICE__THINKING_SPACE_SUMMARY_AGENT_ID }}
          CATEGORIZATION_SERVICE__API_KEY: ${{ secrets.CATEGORIZATION_SERVICE__API_KEY }}
          CATEGORIZATION_SERVICE__SERVER_URL: ${{ secrets.CATEGORIZATION_SERVICE__SERVER_URL }}
          CATEGORIZATION_SERVICE__WEBHOOK_SECRET: ${{ secrets.CATEGORIZATION_SERVICE__WEBHOOK_SECRET }}
          BULK_STORAGE_SERVICE__STORE_NAME: ${{ secrets.BULK_STORAGE_SERVICE__STORE_NAME }}
        run: cargo nextest run --verbose
