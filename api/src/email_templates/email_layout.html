<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{ subject }}</title>
	<style>
	    h1 {
		font-weight: bold;
	    }

	    h2, h3, h4, h5, h6 {
		margin: 0;
	    }

	    p {
		margin: 8px 0;
	    }

	    ul {
		display: inline-block;
	    }

	    .main {
		background-color: #EEF3F7;
		font-size: 16px;
		font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;
		box-sizing: border-box;
		padding: 16px 16px 32px;
		text-align: center;
		color: #111827;
	    }

	    .logo {
		padding: 24px 0;
		width: auto;
		height: 60px;
		margin: 24px auto;
	    }

	    .header-logo {
		display: block;
		width: auto;
		height: 60px;
		margin: 40px auto 32px;
	    }

	    .footer-logo {
		display: block;
		width: auto;
		height: 40px;
		margin: 12px auto 16px;
	    }

	    .button {
		display: inline-block;
		border-radius: 1000px;
		padding: 12px 16px;
		color: white;
		background-color: #2978D0;
		text-decoration: none;
		font-size: 14px;
	    }
		
	    .page {
		max-width: 700px;
		margin: 0 auto;
		background: white;
		text-align: center;
		border-radius: 16px;
		overflow: hidden;
	    }

	    .page-body {
		padding: 12px 24px 24px;
		font-weight: 500;
	    }

	    .hero {
		display: block;
		width: 100%;
		height: auto;
		border: 0;
	    }

	    .card {
		padding: 24px;
		margin: 16px auto;
		gap: 24px;
		text-align: center;
		border-radius: 24px;
		border: solid 1px #E5E7EB;
		width: 50%;
		box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
	    }

	    .invite-eyebrow {
		margin: 16px 0 0;
		color: #0066BD;
		font-size: 14px;
		font-weight: 500;
		letter-spacing: 0.02em;
		text-transform: uppercase;
	    }

	    .invite-title {
		margin: 16px 0 28px;
		font-size: 32px;
		line-height: 1.25;
		font-weight: 700;
	    }

	    .invite-greeting {
		margin: 0 0 16px;
	    }

	    .invite-cta {
		margin: 28px 0 24px;
	    }

	    .invite-button {
		display: block;
		padding: 14px 16px;
		border-radius: 1000px;
		background-color: #0066BD;
		color: #FFFFFF;
		font-size: 16px;
		font-weight: 600;
		text-align: center;
		text-decoration: none;
	    }

	    .invite-link {
		color: #0066BD;
		text-decoration: underline;
		word-break: break-all;
	    }

	    .link {
		text-decoration: underline;
		color: #0066BD;
		font-weight: 600;
	    }

	    .footer {
		margin: 32px auto 0;
		color: #111827;
	    }
	</style>
</head>
<body>
    <header>
	  <h1>{{subject}}</h1>
    </header>

    <div class="main">
	<img class="header-logo" src="{{ header_logo_url }}" alt="" />
	<div class="page">
	    {% block hero %}{% endblock %}
	    <div class="page-body">
		{% block content %}{% endblock %}
	    </div>
	</div>

	<div class="footer">
	    <p>sent using</p>
	    <img class="footer-logo" src="{{ footer_logo_url }}" alt="Comhairle" />
	    {% block footer_reason %}
		{% if organization_name %}
		    <p>on behalf of {{ organization_name }}</p>
		{% endif %}
	    {% endblock %}
	    <p>Copyright {{year}} &copy; CrownShy</p>
	</div>
    </div>
</body>
</html>
