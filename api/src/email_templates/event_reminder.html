<!--

Slots:
- heading
- intro
- body
- footer

Variables:
- event_name
- event_time
- event_link

-->

{% extends "email_layout.html" %}
{% block content %}
	<h1>{{heading}}</h1>

	{{intro|safe}}

	{{body|safe}}

	<div class="card">
		<h2>{{event_name}}</h2>
		<p>{{event_time}}</p>
		<a class="button" href="{{event_link}}">Join event</a>
	</div>

	<p>If you are having trouble with the button above, copy and paste the URL below into your web browser.</p>

	<p class="link">{{event_link}}</p>

	{{footer|safe}}
{% endblock %}
