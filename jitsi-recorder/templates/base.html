<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Jitsi Recorder{% endblock %}</title>
  <style>
    body { font-family: sans-serif; max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
    nav { margin: 1rem 0 1.5rem; }
    nav a { margin-right: 1rem; text-decoration: none; color: #2563eb; }
    nav a:hover { text-decoration: underline; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <h1>Jitsi Recorder</h1>
  <nav>
    <a href="/">Recordings</a>
    <a href="/ui/new">&#43; New Recording</a>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
